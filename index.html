<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopt(k) - Adoption Agreement Parser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0F172A; font-family: system-ui, sans-serif; }
    .loader { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #0b5fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen p-8">
<div class="max-w-4xl mx-auto">
  <h1 class="text-4xl font-bold text-white mb-2">Adopt<span class="text-blue-500">(k)</span></h1>
  <p class="text-gray-400 mb-8">AI Vision-Powered Adoption Agreement Parser</p>

  <div class="bg-slate-800 rounded-xl p-6 mb-6 border border-slate-700">
    <div class="grid md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-blue-400 text-sm font-semibold mb-2">Model</label>
        <select id="model" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-white">
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
          <option value="gemini-3-pro">Gemini 3 Pro</option>
          <option value="gpt-5.2">GPT-5.2</option>
        </select>
      </div>
      <div>
        <label class="block text-blue-400 text-sm font-semibold mb-2">PDF File</label>
        <input type="file" id="pdfFile" accept=".pdf" class="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-600 file:text-white file:cursor-pointer">
      </div>
    </div>
    <div id="fileStatus" class="text-gray-400 text-sm mb-4"></div>
    <button id="extractBtn" onclick="extract()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg disabled:opacity-50" disabled>
      Select a PDF first
    </button>
  </div>

  <div id="loading" class="hidden bg-slate-800 rounded-xl p-8 text-center border border-slate-700">
    <div class="loader mx-auto mb-4"></div>
    <p class="text-white">Analyzing PDF with AI vision...</p>
  </div>

  <div id="results" class="hidden bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
    <div class="bg-blue-600 p-4">
      <h2 class="text-lg font-bold text-white">Extraction Results</h2>
    </div>
    <div id="resultsBody" class="p-4"></div>
  </div>

  <div id="error" class="hidden bg-red-900/50 border border-red-700 rounded-xl p-4 text-red-300"></div>
</div>

<script>
var WORKER = 'https://adoptk-vision.tony-e07.workers.dev';
var pdfBase64 = null;

document.getElementById('pdfFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('fileStatus').textContent = 'Reading: ' + file.name + ' (' + Math.round(file.size/1024) + ' KB)';
  document.getElementById('extractBtn').disabled = true;
  document.getElementById('extractBtn').textContent = 'Reading file...';
  
  var reader = new FileReader();
  reader.onload = function(evt) {
    pdfBase64 = evt.target.result.split(',')[1];
    document.getElementById('fileStatus').textContent = 'Ready: ' + file.name;
    document.getElementById('extractBtn').disabled = false;
    document.getElementById('extractBtn').textContent = 'Extract Plan Data';
  };
  reader.onerror = function() {
    document.getElementById('fileStatus').textContent = 'Error reading file';
    document.getElementById('extractBtn').disabled = true;
  };
  reader.readAsDataURL(file);
});

async function extract() {
  if (!pdfBase64) {
    alert('Please select a PDF file first');
    return;
  }

  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('error').classList.add('hidden');
  document.getElementById('extractBtn').disabled = true;
  document.getElementById('extractBtn').textContent = 'Processing...';

  try {
    var response = await fetch(WORKER + '/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pdf_base64: pdfBase64,
        model: document.getElementById('model').value
      })
    });

    var data = await response.json();
    
    if (!response.ok) {
      throw new Error(data.error || 'Request failed');
    }

    showResults(data);

  } catch (err) {
    document.getElementById('error').textContent = 'Error: ' + err.message;
    document.getElementById('error').classList.remove('hidden');
  } finally {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('extractBtn').disabled = false;
    document.getElementById('extractBtn').textContent = 'Extract Plan Data';
  }
}

function showResults(data) {
  var html = '<table class="w-full text-left"><thead><tr class="border-b border-slate-600"><th class="p-2 text-blue-400">Field</th><th class="p-2 text-blue-400">Value</th></tr></thead><tbody>';
  
  data.rows.forEach(function(row) {
    html += '<tr class="border-b border-slate-700">';
    html += '<td class="p-2 text-gray-300">' + (row.label || '') + '</td>';
    html += '<td class="p-2 text-white">' + (row.value || '-') + '</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table>';
  html += '<p class="text-gray-500 text-sm mt-4">Model: ' + data.model_used + ' | Fields: ' + data.rows.length + '</p>';
  
  document.getElementById('resultsBody').innerHTML = html;
  document.getElementById('results').classList.remove('hidden');
}
</script>
</body>
</html>
